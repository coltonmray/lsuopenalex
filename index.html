<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>LSU OpenAlex Research Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* (unchanged styles omitted for brevity — keep yours exactly as-is) */
</style>
</head>

<body>

<!-- HEADER (unchanged) -->
<div class="header">
  <img src="https://commons.wikimedia.org/w/index.php?title=Special:Redirect/file/Louisiana%20State%20University%20%28logo%29.svg"
       class="header-logo">
  <div class="header-text">
    <div class="header-title">Louisiana State University</div>
    <div class="header-sub">OpenAlex Research Dashboard</div>
  </div>
</div>
<div class="gold-bar"></div>

<div class="container">

<!-- SLIDER -->
<div class="slider-container">
  <div class="slider-wrapper">
    <span id="year-min-label">2020</span>
    <div class="slider-track">
      <div class="slider-ticks" id="slider-ticks"></div>
      <input type="range" id="year-min">
      <input type="range" id="year-max">
    </div>
    <span id="year-max-label">2026</span>
  </div>
</div>

<!-- LOADING -->
<div id="loading" class="loading">
  <div>Loading data from OpenAlex...</div>
  <div class="loading-sub">This may take a few minutes on first load.</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none;">

<div class="tabs">
  <div class="tab active" onclick="showTab('overview', this)">Overview</div>
  <div class="tab" onclick="openPublicationsTab(this)">Recent Publications</div>
  <div class="tab" onclick="openTopCitedTab(this)">Top Cited</div>
  <div class="tab" onclick="openAuthorsTopicsTab(this)">Authors & Topics</div>
</div>

<!-- STATS -->
<div class="stat-grid">
  <div class="stat-card stat-card-purple">
    <div class="stat-label">Works</div>
    <div id="stat-works" class="stat-value">0</div>
  </div>
  <div class="stat-card stat-card-gold">
    <div class="stat-label">Citations</div>
    <div id="stat-citations" class="stat-value">0</div>
  </div>
  <div class="stat-card stat-card-violet">
    <div class="stat-label">Avg Citations</div>
    <div id="stat-avg-citations" class="stat-value">0</div>
  </div>
  <div class="stat-card stat-card-green">
    <div class="stat-label">Open Access</div>
    <div id="stat-oa" class="stat-value">0%</div>
  </div>
</div>

<!-- OVERVIEW -->
<div id="tab-overview" class="tab-content active">

<div class="grid-3">
  <div class="card"><canvas id="chart-year"></canvas></div>
  <div class="card"><canvas id="chart-types"></canvas></div>
  <div class="card"><canvas id="chart-oa"></canvas></div>
</div>

</div>

</div>
</div>

<script>

// ═════════════ SAFE PLUGIN REGISTRATION ═════════════
if (typeof ChartDataLabels !== "undefined") {
  Chart.register(ChartDataLabels);
}

// ═════════════ CONFIG ═════════════
const CONFIG = {
  START_YEAR: 2020,
  CURRENT_YEAR: new Date().getFullYear(),
  ROR_ID: "05ect4e57",
  INSTITUTION_ID: "I121820613"
};

// ═════════════ STATE ═════════════
let allWorks = [];
let charts = {};
let loadingComplete = false;

// ═════════════ UTIL ═════════════
function safeNum(v){ return Number.isFinite(v) ? v : 0; }

function filterWorksByYear(works, min, max){
  return works.filter(w => {
    const y = w.publication_year;
    return y >= min && y <= max;
  });
}

// ═════════════ DATA LOAD (FIXED) ═════════════
async function loadChunks() {
  let cursor = 0;
  let safety = 0;

  while (cursor !== null && safety < 500) {
    safety++;

    const res = await fetch(`./works_api.php?min=${CONFIG.START_YEAR}&max=${CONFIG.CURRENT_YEAR}&cursor=${cursor}`);
    const data = await res.json();

    const cleaned = (data.results || []).map(w => ({
      ...w,
      open_access: {
        is_oa: !!w.is_oa,
        oa_status: w.oa_status || "unknown"
      },
      apc_list: w.apc_value ? { value_usd: w.apc_value } : null
    }));

    allWorks.push(...cleaned);

    cursor = data.meta?.next_cursor ?? null;
  }
}

// ═════════════ INIT (FIXED ORDER) ═════════════
async function init(){
  try {
    await loadChunks();   // wait FIRST

    document.getElementById("loading").style.display = "none";
    document.getElementById("dashboard").style.display = "block";

    setupSliders();
    updateDashboard();

  } catch(e){
    console.error(e);
    document.getElementById("loading").innerHTML = "Error loading data";
  }
}

// ═════════════ SLIDERS (SAFE) ═════════════
function setupSliders(){
  const years = allWorks.map(w => w.publication_year).filter(Boolean);
  const minYear = Math.min(...years);
  const maxYear = Math.max(...years);

  if(!years.length) return;

  const min = document.getElementById("year-min");
  const max = document.getElementById("year-max");

  min.min = max.min = minYear;
  min.max = max.max = maxYear;

  min.value = minYear;
  max.value = maxYear;

  min.oninput = max.oninput = updateDashboard;

  buildTicks(minYear, maxYear);
}

function buildTicks(min,max){
  const el = document.getElementById("slider-ticks");
  el.innerHTML = "";

  const step = Math.max(1, Math.floor((max-min)/5));

  for(let y=min;y<=max;y+=step){
    const s = document.createElement("span");
    s.style.left = ((y-min)/(max-min))*100 + "%";
    s.textContent = y;
    el.appendChild(s);
  }
}

// ═════════════ DASHBOARD (NO FLASHING) ═════════════
function updateDashboard(){

  const min = +document.getElementById("year-min").value;
  const max = +document.getElementById("year-max").value;

  const filtered = filterWorksByYear(allWorks, min, max);

  document.getElementById("stat-works").textContent = filtered.length;

  const citations = filtered.reduce((a,b)=>a+safeNum(b.cited_by_count),0);
  document.getElementById("stat-citations").textContent = citations;

  const avg = filtered.length ? (citations/filtered.length).toFixed(1) : 0;
  document.getElementById("stat-avg-citations").textContent = avg;

  const oa = filtered.filter(w=>w.open_access?.is_oa).length;
  document.getElementById("stat-oa").textContent =
    filtered.length ? Math.round(oa/filtered.length*100)+"%" : "0%";

  renderCharts(filtered);
}

// ═════════════ CHART SAFE DESTROY ═════════════
function destroy(k){
  if(charts[k]) charts[k].destroy();
}

// ═════════════ CHARTS (FIXED SAFE MODE) ═════════════
function renderCharts(data){

  destroy("year");
  const byYear = {};
  data.forEach(w=>{
    byYear[w.publication_year] = (byYear[w.publication_year]||0)+1;
  });

  charts.year = new Chart(document.getElementById("chart-year"), {
    type:"bar",
    data:{
      labels:Object.keys(byYear),
      datasets:[{data:Object.values(byYear)}]
    }
  });

  destroy("oa");
  const oa = data.filter(w=>w.open_access?.is_oa).length;

  charts.oa = new Chart(document.getElementById("chart-oa"), {
    type:"doughnut",
    data:{
      labels:["OA","Closed"],
      datasets:[{data:[oa,data.length-oa]}]
    }
  });
}

// ═════════════ START ═════════════
init();

</script>

</body>
</html>
